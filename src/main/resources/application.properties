# Puerto donde correrá tu API Backend
server.port=8080

# Configuración de conexión a MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/sonido_vivo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL de documentación Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html